<svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Toulmin argument structure: claim supported by data/warrant -->
  <!-- Top node (Claim) -->
  <circle cx="12" cy="4" r="2.5" stroke="black" stroke-width="2" fill="none"/>
  <!-- Middle nodes (Warrant + Backing) -->
  <circle cx="6" cy="13" r="2.5" stroke="black" stroke-width="2" fill="none"/>
  <circle cx="18" cy="13" r="2.5" stroke="black" stroke-width="2" fill="none"/>
  <!-- Bottom node (Data) -->
  <circle cx="12" cy="21" r="2.5" stroke="black" stroke-width="2" fill="none"/>
  <!-- Connecting lines -->
  <line x1="10" y1="6" x2="7.5" y2="11" stroke="black" stroke-width="1.5"/>
  <line x1="14" y1="6" x2="16.5" y2="11" stroke="black" stroke-width="1.5"/>
  <line x1="8" y1="15" x2="10.5" y2="19" stroke="black" stroke-width="1.5"/>
  <line x1="16" y1="15" x2="13.5" y2="19" stroke="black" stroke-width="1.5"/>
</svg>
