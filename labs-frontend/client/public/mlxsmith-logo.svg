  <!-- Spark -->
  <line x1="16" y1="10" x2="18" y2="8" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="12" x2="19" y2="11" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
</svg>
